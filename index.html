<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giveawayser</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .card {
      background: #14141c;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 14px;
      color: #8a8a9e;
      margin-bottom: 24px;
    }
    .giveaway-text {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      flex: 1;
      background: rgba(47,128,237,0.1);
      border: 1px solid rgba(47,128,237,0.3);
      border-radius: 12px;
      padding: 12px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 900;
      color: #2f80ed;
    }
    .stat-label {
      font-size: 11px;
      color: #8a8a9e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 18px;
      background: #2f80ed;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-success {
      background: #22c55e;
    }
    .ticket {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
    }
    .ticket-number {
      font-size: 32px;
      font-weight: 900;
      color: #22c55e;
    }
    .ticket-label {
      font-size: 12px;
      color: #8a8a9e;
      margin-bottom: 4px;
    }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 14px;
      padding: 16px;
      color: #ef4444;
      font-size: 14px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #2f80ed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden { display: none; }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #4a4a5e;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Загрузка -->
    <div id="loading" class="card">
      <div class="loader"></div>
      <div class="subtitle">Загружаем розыгрыш...</div>
    </div>

    <!-- Ошибка -->
    <div id="error" class="card hidden">
      <div class="error" id="error-text">Розыгрыш не найден</div>
    </div>

    <!-- Розыгрыш -->
    <div id="giveaway" class="card hidden">
      <div class="title">🎁 Розыгрыш</div>
      <div class="giveaway-text" id="giveaway-text"></div>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="participants-count">0</div>
          <div class="stat-label">Участников</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="winners-count">1</div>
          <div class="stat-label">Победителей</div>
        </div>
      </div>

      <button class="btn" id="join-btn" onclick="joinGiveaway()">
        🎉 Участвовать
      </button>

      <div id="ticket-result" class="ticket hidden">
        <div class="ticket-label">Твой билет</div>
        <div class="ticket-number" id="ticket-number">-</div>
        <div class="ticket-label" style="margin-top: 8px;">Удачи! 🍀</div>
      </div>
    </div>

    <div class="footer">Giveawayser · @z9hie</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Код розыгрыша из startapp
    const urlParams = new URLSearchParams(window.location.search);
    const startParam = urlParams.get('tgWebAppStartParam') || 
                       tg.initDataUnsafe?.start_param || '';

    const API_URL = 'https://giveawayser.z9hie.workers.dev'; // Замени на свой Worker

    let giveawayData = null;

    // ========== ЗАГРУЗКА РОЗЫГРЫША ==========
    async function loadGiveaway() {
      if (!startParam) {
        showError('Неверная ссылка. Открой розыгрыш через кнопку в Telegram.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/giveaway/${startParam}`);
        const data = await res.json();

        if (!data.success) {
          showError(data.error || 'Розыгрыш не найден');
          return;
        }

        giveawayData = data.giveaway;
        renderGiveaway();
      } catch (e) {
        showError('Ошибка загрузки: ' + e.message);
      }
    }

    // ========== ОТОБРАЖЕНИЕ ==========
    function renderGiveaway() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('giveaway').classList.remove('hidden');

      document.getElementById('giveaway-text').textContent = giveawayData.text;
      document.getElementById('participants-count').textContent = giveawayData.participantsCount || 0;
      document.getElementById('winners-count').textContent = giveawayData.winnersCount || 1;

      // Проверка что уже участвует
      if (giveawayData.alreadyJoined) {
        const btn = document.getElementById('join-btn');
        btn.textContent = '✅ Ты уже участвуешь';
        btn.disabled = true;
        btn.classList.add('btn-success');
      }

      // Если розыгрыш завершён
      if (giveawayData.status === 'finished') {
        const btn = document.getElementById('join-btn');
        btn.textContent = '🏆 Розыгрыш завершён';
        btn.disabled = true;
      }
    }

    // ========== УЧАСТИЕ ==========
    async function joinGiveaway() {
      const btn = document.getElementById('join-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Проверяем...';

      try {
        const res = await fetch(`${API_URL}/api/giveaway/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData,
            code: startParam
          })
        });

        const data = await res.json();

        if (!data.success) {
          btn.textContent = '❌ ' + (data.error || 'Ошибка');
          btn.disabled = false;
          return;
        }

        // Показываем билет
        document.getElementById('join-btn').classList.add('hidden');
        document.getElementById('ticket-result').classList.remove('hidden');
        document.getElementById('ticket-number').textContent = '#' + data.ticket;

        // Haptic feedback
        tg.HapticFeedback?.notificationOccurred('success');

      } catch (e) {
        btn.textContent = '❌ Ошибка сети';
        btn.disabled = false;
      }
    }

    // ========== ОШИБКА ==========
    function showError(text) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('error-text').textContent = text;
    }

    // Запуск
    loadGiveaway();
  </script>
</body>
</html>
