<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Giveaways</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f1);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8e8e93);--blue:var(--tg-theme-button-color,#2481cc);--blueText:var(--tg-theme-button-text-color,#fff);--line:var(--tg-theme-section-separator-color,rgba(0,0,0,.08));--red:#e53935}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}.app{width:min(680px,100%);margin:auto;padding:10px 16px 28px}.top{height:42px;display:flex;align-items:center}.back{display:none;border:0;background:transparent;color:var(--blue);font-size:16px;padding:7px 3px}.back.show{display:block}h1{font-size:28px;line-height:1.15;letter-spacing:-.5px;margin:8px 0 18px}h2{font-size:21px;margin:0 0 8px}.hint{color:var(--hint);font-size:14px}.section-title{font-size:13px;color:var(--hint);margin:22px 2px 8px}.card{background:var(--sec);border-radius:12px;overflow:hidden}.row{padding:14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.primary,.secondary,.danger{width:100%;min-height:46px;border:0;border-radius:10px;font-weight:600}.primary{background:var(--blue);color:var(--blueText);margin-top:12px}.secondary{background:var(--sec);color:var(--text)}.danger{background:transparent;color:var(--red);margin-top:8px}.field{display:block;color:var(--hint);font-size:13px;margin-bottom:7px}textarea,input{width:100%;border:0;outline:0;border-radius:10px;background:var(--sec);color:var(--text);padding:12px 13px;font:inherit}textarea{min-height:150px;resize:vertical;line-height:1.45}input{min-height:46px}.counter{text-align:right;color:var(--hint);font-size:12px;margin-top:5px}.control{height:48px;background:var(--sec);border-radius:10px;display:flex;align-items:center;justify-content:space-between;overflow:hidden}.control button{height:48px;width:54px;border:0;background:transparent;color:var(--blue);font-size:25px}.control span{font-size:18px;font-weight:600}.photo{min-height:150px;border-radius:10px;background:var(--sec);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--hint)}.photo img{width:100%;max-height:300px;object-fit:cover}.photo-actions{display:flex;gap:8px;margin-top:8px}.photo-actions button{flex:1}.preview{background:var(--sec);border-radius:12px;padding:16px;line-height:1.5;overflow-wrap:anywhere}.preview-text{white-space:pre-wrap}.tg-button-row{display:flex;margin-top:14px}.tg-button{display:inline-block;background:var(--blue);color:var(--blueText);padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:600;text-align:center}.list-card{margin-bottom:9px}.gcard{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.gcard:last-child{border-bottom:0}.gtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;gap:14px;color:var(--hint);font-size:13px;margin-top:7px}.status{font-size:12px;color:var(--hint);margin-bottom:5px}.active-status{color:#159447}.empty,.loading{text-align:center;padding:25px;color:var(--hint)}.hero{text-align:center;padding:9px 0 18px}.emoji{font-size:40px;margin-bottom:8px}.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:var(--sec);border-radius:10px;padding:12px 7px;text-align:center}.stat strong{display:block;font-size:19px}.stat span{font-size:12px;color:var(--hint)}.ticket{text-align:center;background:var(--sec);border-radius:12px;padding:17px;margin:12px 0}.ticket small{display:block;color:var(--hint);margin-bottom:4px}.ticket b{font-size:30px;letter-spacing:1px}.notice{background:var(--sec);border-radius:10px;padding:12px 14px;color:var(--hint);font-size:14px;line-height:1.4}.winner{padding:11px 14px;border-bottom:1px solid var(--line)}.winner:last-child{border:0}.toast{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:10px;text-align:center;font-size:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.15s;z-index:20}.toast.show{opacity:1;transform:none}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app"><div class="top"><button id="back" class="back" onclick="back()">‹ Назад</button></div>
<section id="home" class="screen"><h1>Розыгрыши</h1><button class="primary" onclick="createScreen()">+ Новый розыгрыш</button><div class="section-title">Активные</div><div id="active" class="card list-card"></div><div class="section-title">Завершённые</div><div id="finished" class="card list-card"></div></section>
<section id="create" class="screen hidden"><h1>Новый розыгрыш</h1><div class="section-title">Текст</div><div class="card"><div class="row"><label class="field">Текст публикации</label><textarea id="text" maxlength="32768" placeholder="🎁 Разыгрываю подарок!"></textarea><div id="count" class="counter">0 / 32768</div></div></div><div class="section-title">Фотография</div><div class="card"><div class="row"><div id="photo" class="photo">Фото не добавлено</div><div class="photo-actions"><button class="secondary" onclick="file.click()">Добавить фото</button><button id="remove" class="secondary hidden" onclick="removePhoto()">Удалить</button></div><input id="file" type="file" accept="image/*" class="hidden"></div></div><div class="section-title">Победители</div><div class="card"><div class="row"><div class="control"><button onclick="changeW(-1)">−</button><span id="wn">1</span><button onclick="changeW(1)">+</button></div></div></div><div class="section-title">Кнопка участия</div><div class="card"><div class="row"><label class="field">Текст кнопки</label><input id="button" maxlength="64" value="Участвовать"></div></div><div class="section-title">Окончание</div><div class="card"><div class="row"><label class="field">Необязательно</label><input id="ends" type="datetime-local"></div></div><div class="section-title">Предпросмотр</div><div id="preview" class="preview"></div><button class="primary" onclick="create()">Создать розыгрыш</button></section>
<section id="giveaway" class="screen hidden"><div id="gcontent"></div></section>
</div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp, API_BASE="__WORKER_URL__".replace(/\/$/,"");let user=null,current=null,winners=1,photoId=null,screen="home";
if(tg){tg.ready();tg.expand()}
const H=()=>({'X-Telegram-Init-Data':tg?.initData||''});
async function api(path,opt={}){const r=await fetch(API_BASE+path,{...opt,headers:{...H(),...(opt.headers||{})}});let d;try{d=await r.json()}catch{throw Error('Некорректный ответ сервера')}if(!r.ok||d.error)throw Error(d.error||'Ошибка');return d}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function show(id,backBtn){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById('back').classList.toggle('show',!!backBtn)}
function back(){if(screen==='giveaway'){screen='home';show('home',false);load()}else if(screen==='create'){screen='home';show('home',false)}else tg?.close()}
async function boot(){if(!tg?.initData){document.getElementById('active').innerHTML='<div class="empty">Откройте Mini App из Telegram.</div>';return}try{const m=await api('/api/me');user=m.user;const p=new URLSearchParams(tg.initData).get('start_param');if(p)open(p);else if(m.isAdmin)load();else{document.getElementById('active').innerHTML='<div class="empty">Откройте ссылку на розыгрыш.</div>';document.getElementById('finished').innerHTML=''}}catch(e){toast(e.message)}}
async function load(){screen='home';show('home',false);const a=document.getElementById('active'),f=document.getElementById('finished');a.innerHTML='<div class="loading">Загрузка…</div>';f.innerHTML='';try{const d=await api('/api/my-giveaways');const aa=d.giveaways.filter(x=>x.status==='active'),ff=d.giveaways.filter(x=>x.status==='finished');a.innerHTML=aa.length?aa.map(card).join(''):'<div class="empty">Пока пусто.</div>';f.innerHTML=ff.length?ff.map(card).join(''):'<div class="empty">Пока пусто.</div>'}catch(e){a.innerHTML='<div class="empty">Не удалось загрузить.</div>';toast(e.message)}}
function card(g){const t=esc((g.text||'Розыгрыш').replace(/\s+/g,' ').slice(0,70));return `<div class="gcard" onclick="open('${escA(g.code)}')"><div class="status ${g.status==='active'?'active-status':''}">${g.status==='active'?'Активен':'Завершён'}</div><div class="gtitle">${t}</div><div class="stats"><span>👥 ${g.participantCount}</span><span>🏆 ${g.winnersCount}</span><span>#${esc(g.code)}</span></div></div>`}
function createScreen(){screen='create';winners=1;photoId=null;show('create',true);text.value='';button.value='Участвовать';ends.value='';wn.textContent='1';file.value='';photo.textContent='Фото не добавлено';remove.classList.add('hidden');previewUpdate()}
function changeW(n){winners=Math.max(1,Math.min(350,winners+n));wn.textContent=winners}
text.addEventListener('input',previewUpdate);button.addEventListener('input',previewUpdate);
function previewUpdate(){count.textContent=`${text.value.length} / 32768`;preview.innerHTML=`<div class="preview-text">${esc(text.value||'Введите текст розыгрыша…')}</div><div class="tg-button-row"><a class="tg-button" href="javascript:void(0)">${esc(button.value||'Участвовать')}</a></div>`}
file.addEventListener('change',async()=>{const f=file.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Нужно изображение');if(f.size>10*1024*1024)return toast('Максимум 10 МБ');photo.textContent='Загрузка…';try{const fd=new FormData();fd.append('file',f);const d=await api('/api/upload',{method:'POST',body:fd});photoId=d.fileId;photo.innerHTML=`<img src="${URL.createObjectURL(f)}">`;remove.classList.remove('hidden')}catch(e){photo.textContent='Фото не добавлено';toast(e.message)}});
function removePhoto(){photoId=null;file.value='';photo.textContent='Фото не добавлено';remove.classList.add('hidden')}
async function create(){const t=text.value.trim(),b=button.value.trim();if(!t)return toast('Введите текст');if(!b)return toast('Введите текст кнопки');let end=null;if(ends.value){const d=new Date(ends.value);if(!Number.isFinite(d.getTime())||d<=new Date())return toast('Дата должна быть в будущем');end=d.toISOString()}try{const d=await api('/api/giveaways',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,winnersCount:winners,buttonText:b,endsAt:end,photoFileId:photoId})});current=d.giveaway;screen='giveaway';show('giveaway',true);created(d)}catch(e){toast(e.message)}}
function created(d){gcontent.innerHTML=`<div class="hero"><div class="emoji">✓</div><h2>Розыгрыш создан</h2><div class="hint">#${esc(d.giveaway.code)}</div></div><div class="card"><div class="row"><div class="field">Ссылка для участников</div><div class="notice">${esc(d.deepLink)}</div></div></div><button class="primary" onclick="copy('${escA(d.deepLink)}')">Скопировать ссылку</button><button class="secondary" style="margin-top:8px" onclick="share('${escA(d.deepLink)}')">Поделиться</button>`}
async function open(code){screen='giveaway';show('giveaway',true);gcontent.innerHTML='<div class="loading">Загрузка…</div>';try{const d=await api('/api/giveaway/'+encodeURIComponent(code));current=d.giveaway;render(d.giveaway)}catch(e){gcontent.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function render(g){const mine=String(user.id)===String(g.ownerId);let h=`<div class="hero"><div class="emoji">${g.status==='active'?'🎁':'🏁'}</div><h2>${g.status==='active'?'Розыгрыш':'Розыгрыш завершён'}</h2></div><div class="preview"><div class="preview-text">${esc(g.text)}</div>${g.status==='active'?`<div class="tg-button-row"><a class="tg-button" href="javascript:void(0)">${esc(g.buttonText)}</a></div>`:''}</div><div class="bigstats"><div class="stat"><strong>${g.participantCount}</strong><span>участников</span></div><div class="stat"><strong>${g.winnersCount}</strong><span>победителей</span></div><div class="stat"><strong>${g.status==='active'?left(g.endsAt):'готово'}</strong><span>${g.status==='active'?'до конца':'статус'}</span></div></div>`;if(g.status==='active'){h+=g.joined?`<div class="ticket"><small>Ваш билет</small><b>#${String(g.ticket).padStart(4,'0')}</b></div>`:`<button class="primary" onclick="join()">${esc(g.buttonText)}</button>`;if(mine)h+='<button class="danger" onclick="finish()">Завершить розыгрыш</button>'}else{h+='<div class="section-title">Победители</div><div class="card">'+(g.winners.length?g.winners.map((w,i)=>`<div class="winner">${i+1}. ${winner(w)}</div>`).join(''):'<div class="empty">Участников не было.</div>')+'</div>';if(g.joined){const won=g.winners.some(w=>String(w.userId)===String(user.id));h+=`<div class="notice" style="margin-top:10px">Ваш билет: #${String(g.ticket).padStart(4,'0')}<br>${won?'🎉 Вы победили!':'Вы не выиграли в этот раз.'}</div>`}}gcontent.innerHTML=h}
async function join(){try{const d=await api('/api/giveaway/'+encodeURIComponent(current.code)+'/join',{method:'POST'});toast(d.alreadyJoined?'Вы уже участвуете':'Вы участвуете!');open(current.code)}catch(e){toast(e.message)}}
async function finish(){if(!confirm(`Завершить розыгрыш?\n\nБудут выбраны до ${current.winnersCount} победителей из ${current.participantCount} участников.`))return;try{const d=await api('/api/giveaway/'+encodeURIComponent(current.code)+'/finish',{method:'POST'});current.status='finished';current.winners=d.winners;current.participantCount=d.participantCount;render(current);toast('Победители выбраны')}catch(e){toast(e.message)}}
function winner(w){if(w.username)return '@'+esc(w.username);return esc([w.firstName,w.lastName].filter(Boolean).join(' ')||'Победитель')}
function left(x){if(!x)return'∞';const d=x-Date.now();if(d<=0)return'сейчас';const s=Math.floor(d/1000),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return dd?dd+'д':h?h+'ч':m+'м'}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Ссылка скопирована')}catch{toast('Не удалось скопировать')}}function share(s){const u='https://t.me/share/url?url='+encodeURIComponent(s)+'&text='+encodeURIComponent('🎁 Розыгрыш!');tg?.openTelegramLink?tg.openTelegramLink(u):open(u,'_blank')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function escA(s){return esc(s)}
boot();
</script>
</body></html>
